cv:
  name: Rohit John
  label: Computer Science Graduate & ML Researcher
  email: rohitpauljohn@gmail.com
  location: Bristol, United Kingdom
  image: ""
  summary: MComp Computer Science graduate from the University of Bath, working on improving Computer Algebra with Machine Learning. Published research on graph neural networks for quantifier elimination and reinforcement learning for symbolic integration, alongside industrial software development experience, now looking to work on Technical AI Safety research.

  social_networks:
    - network: GitHub
      username: rohitpj
    - network: LinkedIn
      username: rohitpauljohn

  sections:
    Education:
      - institution: University of Bath
        location: Bath, United Kingdom
        url: https://www.bath.ac.uk/
        area: Computer Science
        studyType: MComp (Hons), First Class
        start_date: 2021-09
        end_date: 2026-05
        highlights:
          - "Relevant modules: Natural Language Processing, Reinforcement Learning, Machine Learning, Advanced Visual Computing, Safety Critical Systems, HCI & User Experience, Discrete Mathematics, Software Processes & Modelling."

    Experience:
      - company: SLB Cambridge Research
        position: Software Engineer Intern
        location: Cambridge, United Kingdom
        start_date: 2024-08
        end_date: 2025-09
        highlights:
          - Finetuned, evaluated and deployed an LLM-based system to improve safety on oil wells using multi-modal datasets, currently under invention disclosure.
          - Modified the Kuhn-Munkres and Murty algorithms to optimise scheduling systems on oil rigs, and developed novel graph partitioning algorithms to process more complex rig operations.
          - Built a digital twin of a solar-powered energy storage system and optimised construction and production plans to minimise cost and greenhouse gas emissions.

      - company: University of Exeter
        position: Research Placement
        location: Exeter, United Kingdom
        start_date: 2023-07
        end_date: 2023-09
        highlights:
          - Developed prediction models for noisy and incomplete weather datasets by implementing advanced Bayesian models for imputation and prediction.
          - Adapted the Transformer architecture to forecast time series data with accuracy competitive with state-of-the-art models.
          - Optimised lecture schedules based on predicted energy consumption and presented the results at a departmental symposium.

      - company: Johns Accountancy and Taxation
        position: Accounts Assistant & IT Technician
        location: Bristol, United Kingdom
        start_date: 2020-03
        end_date: 2022-05
        highlights:
          - Maintained complex computer networks, providing consistent and effective troubleshooting.
          - Performed client data analysis, evaluating performance and identifying potential efficiency improvements.
          - Organised the transition to remote work, coordinating with team members and external vendors to implement robust, secure network infrastructure.

    Publications:
      - title: "Replacing Heuristic Rule Ordering in Symbolic Integration with Learned Policies"
        authors:
          - Rohit John
          - Rashid Barket
          - Matthew England
        publisher: "SCML 2026 — Conference on Symbolic Computation and Machine Learning; submitted to the Journal of Symbolic Computation"
        releaseDate: 2026
        summary: Improved symbolic integration in the SymPy computer algebra system by using reinforcement learning and Transformer models to learn optimal rule selection, rather than relying on hand-written heuristics or pre-labelled datasets.

      - title: "Exploring Alternative Machine Learning Models for Variable Ordering in Cylindrical Algebraic Decomposition"
        authors:
          - Rohit John
          - James Davenport
        publisher: "Mathematical Software – ICMS 2024, Lecture Notes in Computer Science, Springer, pp. 176–185"
        releaseDate: 2024
        url: https://doi.org/10.1007/978-3-031-64529-7_20
        summary: Optimised quantifier elimination solving using novel graph neural network representations, while resolving significant data pollution issues present in existing datasets of quantifier elimination problems. Presented at ICMS 2024 and published in the proceedings.

